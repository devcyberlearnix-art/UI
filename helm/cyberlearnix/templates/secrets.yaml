apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cyberlearnix.fullname" . }}-secrets
  labels:
    {{- include "cyberlearnix.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgresql.password | default "cyberlearnix_prod_db_secret_2026" | quote }}
  JWT_SECRET: {{ .Values.security.jwtSecret | default "cyberlearnix_ultra_hardened_jwt_symmetric_signing_secret_key_2026_xyz" | quote }}
  REDIS_PASSWORD: {{ .Values.redis.password | default "" | quote }}
  RAZORPAY_KEY_ID: {{ .Values.payment.razorpayKeyId | default "rzp_live_cyberlearnix_prod" | quote }}
  RAZORPAY_KEY_SECRET: {{ .Values.payment.razorpayKeySecret | default "secret_live_cyberlearnix_prod" | quote }}
