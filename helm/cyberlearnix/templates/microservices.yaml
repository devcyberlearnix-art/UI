{{- range $key, $service := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cyberlearnix.fullname" $ }}-{{ $service.name }}
  labels:
    {{- include "cyberlearnix.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $service.name }}
spec:
  replicas: {{ $service.replicaCount | default 2 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "cyberlearnix.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $service.name }}
  template:
    metadata:
      labels:
        {{- include "cyberlearnix.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $service.name }}
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - {{ $service.name }}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: {{ $service.name }}
          image: "{{ $service.image.repository }}:{{ $service.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "cyberlearnix.fullname" $ }}-config
            - secretRef:
                name: {{ include "cyberlearnix.fullname" $ }}-secrets
          env:
            - name: SERVER_PORT
              value: {{ $service.port | quote }}
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ $.Values.postgresql.host }}:{{ $.Values.postgresql.port }}/{{ $service.database }}?sslmode={{ $.Values.postgresql.sslMode }}"
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ $.Values.postgresql.user | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cyberlearnix.fullname" $ }}-secrets
                  key: POSTGRES_PASSWORD
            - name: SPRING_DATA_REDIS_HOST
              value: "{{ include "cyberlearnix.fullname" $ }}-redis"
            - name: SPRING_DATA_REDIS_PORT
              value: {{ $.Values.redis.port | quote }}
            {{- if $service.env }}
            {{- range $eKey, $eVal := $service.env }}
            - name: {{ $eKey }}
              value: {{ $eVal | quote }}
            {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          resources:
            {{- toYaml $service.resources | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cyberlearnix.fullname" $ }}-{{ $service.name }}
  labels:
    {{- include "cyberlearnix.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $service.name }}
spec:
  type: ClusterIP
  ports:
    - port: {{ $service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "cyberlearnix.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $service.name }}
{{- end }}
