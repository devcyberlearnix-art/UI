apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cyberlearnix.fullname" . }}-config
  labels:
    {{- include "cyberlearnix.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.global.environment | quote }}
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,metrics,prometheus,info"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "when-authorized"
  REDIS_HOST: "{{ include "cyberlearnix.fullname" . }}-redis"
  REDIS_PORT: {{ .Values.redis.port | quote }}
  POSTGRES_HOST: {{ .Values.postgresql.host | quote }}
  POSTGRES_PORT: {{ .Values.postgresql.port | quote }}
  POSTGRES_USER: {{ .Values.postgresql.user | quote }}
  POSTGRES_SSLMODE: {{ .Values.postgresql.sslMode | quote }}
  POSTGRES_POOL_SIZE: {{ .Values.postgresql.poolSize | quote }}
  CORS_ALLOWED_ORIGINS: "https://{{ .Values.global.domain }},https://*.{{ .Values.global.domain }}"
  TOKEN_EXPIRATION_HOURS: "24"
