{{- if and .Values.ui.enabled .Values.ui.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "cyberlearnix.fullname" . }}-ui-hpa
  labels:
    {{- include "cyberlearnix.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "cyberlearnix.fullname" . }}-ui
  minReplicas: {{ .Values.ui.hpa.minReplicas }}
  maxReplicas: {{ .Values.ui.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.ui.hpa.targetCPUUtilizationPercentage }}
    {{- if .Values.ui.hpa.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.ui.hpa.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}

{{- if and .Values.gateway.enabled .Values.gateway.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "cyberlearnix.fullname" . }}-gateway-hpa
  labels:
    {{- include "cyberlearnix.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "cyberlearnix.fullname" . }}-gateway
  minReplicas: {{ .Values.gateway.hpa.minReplicas }}
  maxReplicas: {{ .Values.gateway.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.gateway.hpa.targetCPUUtilizationPercentage }}
{{- end }}

{{- range $key, $service := .Values.services }}
{{- if and $service.hpa $service.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "cyberlearnix.fullname" $ }}-{{ $service.name }}-hpa
  labels:
    {{- include "cyberlearnix.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $service.name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "cyberlearnix.fullname" $ }}-{{ $service.name }}
  minReplicas: {{ $service.hpa.minReplicas | default 2 }}
  maxReplicas: {{ $service.hpa.maxReplicas | default 8 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $service.hpa.targetCPU | default 75 }}
{{- end }}
{{- end }}
