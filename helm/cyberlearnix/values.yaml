    port: 8081
    database: lms_cart_db
    replicaCount: 2
    image:
      repository: cyberlearnix/cart-service
      tag: "1.0.0"
    resources:
      limits: { cpu: 800m, memory: 768Mi }
      requests: { cpu: 150m, memory: 384Mi }
    hpa: { enabled: true, minReplicas: 2, maxReplicas: 10, targetCPU: 75 }

  coupon:
    name: coupon-service
    port: 8082
    database: lms_coupon_db
    replicaCount: 2
    image:
      repository: cyberlearnix/coupon-service
      tag: "1.0.0"
    resources:
      limits: { cpu: 600m, memory: 512Mi }
      requests: { cpu: 100m, memory: 256Mi }
    hpa: { enabled: false }

  order:
    name: order-service
    port: 8084
    database: lms_order_db
    replicaCount: 3
    image:
      repository: cyberlearnix/order-service
      tag: "1.0.0"
    resources:
      limits: { cpu: 1000m, memory: 1024Mi }
      requests: { cpu: 250m, memory: 512Mi }
    hpa: { enabled: true, minReplicas: 3, maxReplicas: 12, targetCPU: 70 }

  payment:
    name: payment-service
    port: 8085
    database: lms_payment_db
    replicaCount: 3
    image:
      repository: cyberlearnix/payment-service
      tag: "1.0.0"
    resources:
      limits: { cpu: 1000m, memory: 1024Mi }
      requests: { cpu: 250m, memory: 512Mi }
    hpa: { enabled: true, minReplicas: 3, maxReplicas: 10, targetCPU: 70 }

  review:
    name: review-service
    port: 8089
    database: lms_review_db
    replicaCount: 2
    image:
      repository: cyberlearnix/review-service
      tag: "1.0.0"
    resources:
