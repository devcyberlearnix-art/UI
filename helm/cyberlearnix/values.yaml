    database: lms_notification_db
    replicaCount: 2
    image:
      repository: cyberlearnix/notification-service
      tag: "1.0.0"
    resources:
      limits: { cpu: 800m, memory: 768Mi }
      requests: { cpu: 200m, memory: 384Mi }
    hpa: { enabled: true, minReplicas: 2, maxReplicas: 8, targetCPU: 75 }

  wishlist:
    name: wishlist-service
    port: 8090
    database: lms_wishlist_db
    replicaCount: 2
    image:
      repository: cyberlearnix/wishlist-service
      tag: "1.0.0"
    resources:
      limits: { cpu: 600m, memory: 512Mi }
      requests: { cpu: 100m, memory: 256Mi }
    hpa: { enabled: false }

# ------------------------------------------------------------------------------
# Data Persistence: Redis 7 In-Memory Cluster & State Broker
# ------------------------------------------------------------------------------
redis:
  enabled: true
  replicas: 1
  port: 6379
  image:
    repository: redis
    tag: "7.2-alpine"
  resources:
    limits:
      cpu: 500m
      memory: 1024Mi
    requests:
      cpu: 100m
      memory: 256Mi
  persistence:
    enabled: true
    storageClass: ""
    size: 5Gi

# ------------------------------------------------------------------------------
# External PostgreSQL Managed Cluster Coordinates
# ------------------------------------------------------------------------------
postgresql:
  host: "postgres-cluster.cyberlearnix-data.svc.cluster.local"
  port: 5432
  user: "postgres"
  sslMode: "require"
  poolSize: 20
